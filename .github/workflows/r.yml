# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# See https://github.com/r-lib/actions/tree/master/examples#readme for
# additional example workflows available for the R community.
#
# This is not an R package (no DESCRIPTION), so there is nothing for
# rcmdcheck to check. Instead this installs the pinned dependencies
# (R/install_packages.R) and syntax-checks every script in R/.

name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up R 4.3
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: Install system dependencies
        run: brew install gdal geos proj udunits glpk
      - name: Install R package dependencies
        run: |
          # xgboost's configure script auto-detects Homebrew's libomp and links
          # against it, while R's own default link path pulls in the different,
          # older libomp.dylib R itself bundles -- loading both into one process
          # segfaults. Hiding `brew` from PATH makes xgboost's configure cleanly
          # fall back to a single-threaded (non-OpenMP) build, which is correct
          # and crash-free; CI only needs it to install and load, not be fast.
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v homebrew | tr '\n' ':')
          Rscript R/install_packages.R
      - name: Syntax-check R scripts
        run: |
          files <- list.files("R", pattern = "\\.R$", full.names = TRUE)
          for (f in files) { message("Parsing ", f); parse(f) }
        shell: Rscript {0}
